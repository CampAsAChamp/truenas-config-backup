repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        files: ^app/
        stages: [pre-push]
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: .venv/bin/python -m pytest --cov --tb=short -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
