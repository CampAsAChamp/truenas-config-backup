groups:
  - name: TrueNAS Config Backup Configuration
    description: Configure TrueNAS Config Backup
  - name: Network Configuration
    description: Configure Network for TrueNAS Config Backup
  - name: Storage Configuration
    description: Configure Storage for TrueNAS Config Backup
  - name: Resources Configuration
    description: Configure Resources for TrueNAS Config Backup

questions:
  - variable: backup_config
    label: ""
    group: TrueNAS Config Backup Configuration
    schema:
      type: dict
      attrs:
        - variable: truenas_url
          label: TrueNAS URL
          description: |
            The base URL of the TrueNAS system to back up. Must use https:// (even on
            a local network) — http:// causes TrueNAS to revoke the API key. Examples:
            https://127.0.0.1 for the same box, or https://192.168.1.50 for the host
            LAN IP if the container cannot reach loopback.
          schema:
            type: string
            required: true
            default: "https://127.0.0.1"
        - variable: api_key
          label: API Key
          description: |
            A TrueNAS API key for the target system (My API Keys in the TrueNAS UI).
            Recommended to scope it to config.save only (least privilege). If a key
            was revoked after an http:// connection attempt, create a new key here.
          schema:
            type: string
            required: true
            private: true
        - variable: verify_ssl
          label: Verify SSL Certificate
          description: |
            Disable this if the target TrueNAS uses a self-signed certificate (common
            for home-lab setups). The connection is still encrypted; only certificate
            verification is skipped.
          schema:
            type: boolean
            default: false
        - variable: schedule_mode
          label: Backup Schedule
          description: |
            How often to run scheduled backups. Choose Manual for on-demand backups
            only (use Run backup now on the dashboard).
          schema:
            type: string
            default: manual
            enum:
              - value: manual
                description: Manual only (no schedule)
              - value: daily
                description: Daily at the configured time
              - value: weekly
                description: Weekly on the configured day and time
              - value: monthly
                description: Monthly on the configured day of month and time
              - value: custom
                description: Custom 5-field cron expression
        - variable: schedule_time
          label: Schedule Time
          description: |
            Time of day for daily, weekly, or monthly schedules (24-hour HH:MM).
            Ignored when schedule mode is Manual or Custom.
          schema:
            type: string
            default: "03:00"
        - variable: schedule_dow
          label: Schedule Day of Week
          description: |
            Day of week for weekly schedules (0 = Sunday through 6 = Saturday).
            Ignored unless schedule mode is Weekly.
          schema:
            type: int
            default: 0
            min: 0
            max: 6
        - variable: schedule_dom
          label: Schedule Day of Month
          description: |
            Day of month for monthly schedules (1-28). Ignored unless schedule mode
            is Monthly.
          schema:
            type: int
            default: 1
            min: 1
            max: 28
        - variable: cron_schedule
          label: Custom Cron Expression
          description: |
            Standard 5-field cron syntax, e.g. "0 3 * * 0" for weekly at 3am Sunday.
            Only used when schedule mode is Custom. See crontab.guru for help.
          schema:
            type: string
            required: false
            default: ""
        - variable: dashboard_password
          label: Dashboard Password
          description: |
            Optional HTTP Basic Auth password for the web dashboard. When set, the
            username can be anything; only the password is checked. Leave empty to
            allow unauthenticated access (restrict port exposure on your network).
          schema:
            type: string
            required: false
            private: true
            default: ""
        - variable: notify_webhook_url
          label: Notification Webhook URL
          description: |
            Optional URL to POST JSON backup event notifications (failures by default;
            enable Notify on Success for heartbeat alerts). Works with Discord, Slack,
            ntfy, Home Assistant, and other webhook receivers.
          schema:
            type: string
            required: false
            default: ""
        - variable: notify_on_success
          label: Notify on Success
          description: |
            Also POST to the notification webhook when a backup succeeds. Off by default
            (failures only).
          schema:
            type: boolean
            default: false
        - variable: health_check_truenas
          label: Health Check TrueNAS Connection
          description: |
            When enabled, /readyz probes TrueNAS connectivity (slower; requires a
            valid API key). Container liveness still uses /healthz only.
          schema:
            type: boolean
            default: false
        - variable: retention_count
          label: Retention Count
          description: Number of past backups to keep before pruning the oldest.
          schema:
            type: int
            default: 8
            min: 1
            required: true
        - variable: include_secret_seed
          label: Include Secret Seed
          description: |
            Include the password secret seed in the backup. Required to restore
            encrypted passwords from this backup onto a new system.
          schema:
            type: boolean
            default: true
        - variable: display_date_format
          label: Display Date Format
          description: |
            Default date/time format for timestamps on the dashboard. Users can
            override this per browser in Display settings.
          schema:
            type: string
            default: "dd/mm/yy"
            enum:
              - value: "dd/mm/yy"
                description: "28/07/26 14:30"
              - value: "dd/mm/yyyy"
                description: "28/07/2026 14:30:45"
              - value: "mm/dd/yy"
                description: "07/28/26 14:30"
              - value: "mm/dd/yyyy"
                description: "07/28/2026 14:30:45"
              - value: "iso"
                description: ISO 8601
        - variable: display_clock_format
          label: Display Clock Format
          description: |
            Default 12- or 24-hour clock for dashboard timestamps. Ignored when
            date format is ISO 8601. Users can override per browser in Display settings.
          schema:
            type: string
            default: "24h"
            enum:
              - value: "24h"
                description: 24-hour (14:30)
              - value: "12h"
                description: 12-hour (2:30 PM)
        - variable: display_timezone_mode
          label: Display Timezone Mode
          description: |
            Default timezone for dashboard timestamps. Local uses the viewer's
            browser timezone when overridden in Display settings.
          schema:
            type: string
            default: "local"
            enum:
              - value: "local"
                description: Local (browser or container TZ)
              - value: "utc"
                description: UTC
              - value: "manual"
                description: Manual IANA timezone
        - variable: display_timezone
          label: Display Timezone (IANA)
          description: |
            IANA timezone name used when Display Timezone Mode is Manual
            (e.g. Europe/London, America/Los_Angeles).
          schema:
            type: string
            required: false
            default: ""
            show_if: [["display_timezone_mode", "=", "manual"]]

  - variable: network
    label: ""
    group: Network Configuration
    schema:
      type: dict
      attrs:
        - variable: web_port
          label: WebUI Port
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                description: |
                  The port bind mode.</br>
                  - Publish: The port will be published on the host for external access.</br>
                  - Expose: The port will be exposed for inter-container communication.</br>
                  - None: The port will not be exposed or published.</br>
                  Note: If the Dockerfile defines an EXPOSE directive,
                  the port will still be exposed for inter-container communication regardless of this setting.
                schema:
                  type: string
                  default: "published"
                  enum:
                    - value: "published"
                      description: Publish port on the host for external access
                    - value: "exposed"
                      description: Expose port for inter-container communication
                    - value: ""
                      description: None
              - variable: port_number
                label: Port Number
                schema:
                  type: int
                  default: 30330
                  min: 1
                  max: 65535
                  required: true
              - variable: host_ips
                label: Host IPs
                description: IPs on the host to bind this port
                schema:
                  type: list
                  show_if: [["bind_mode", "=", "published"]]
                  default: []
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true
                        $ref:
                          - definitions/node_bind_ip

  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: backups
          label: Backups Storage
          description: Where downloaded config backup tar files are stored.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                description: |
                  ixVolume: Is dataset created automatically by the system.</br>
                  Host Path: Is a path that already exists on the system.
                schema:
                  type: string
                  required: true
                  default: "ix_volume"
                  enum:
                    - value: "host_path"
                      description: Host Path (Path that already exists on the system)
                    - value: "ix_volume"
                      description: ixVolume (Dataset created automatically by the system)
              - variable: ix_volume_config
                label: ixVolume Configuration
                description: The configuration for the ixVolume dataset.
                schema:
                  type: dict
                  show_if: [["type", "=", "ix_volume"]]
                  $ref:
                    - "normalize/ix_volume"
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      description: The name of the dataset to use for storage.
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: "backups"
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "host_path"]]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
                        $ref:
                          - "normalize/acl"
                    - variable: path
                      label: Host Path
                      description: The host path to use for storage.
                      schema:
                        type: hostpath
                        show_if: [["acl_enable", "=", false]]
                        required: true
        - variable: config
          label: Config/State Storage
          description: Where the app stores its run history log.
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                description: |
                  ixVolume: Is dataset created automatically by the system.</br>
                  Host Path: Is a path that already exists on the system.
                schema:
                  type: string
                  required: true
                  default: "ix_volume"
                  enum:
                    - value: "host_path"
                      description: Host Path (Path that already exists on the system)
                    - value: "ix_volume"
                      description: ixVolume (Dataset created automatically by the system)
              - variable: ix_volume_config
                label: ixVolume Configuration
                description: The configuration for the ixVolume dataset.
                schema:
                  type: dict
                  show_if: [["type", "=", "ix_volume"]]
                  $ref:
                    - "normalize/ix_volume"
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      description: The name of the dataset to use for storage.
                      schema:
                        type: string
                        required: true
                        hidden: true
                        default: "config"
                    - variable: acl_entries
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
              - variable: host_path_config
                label: Host Path Configuration
                schema:
                  type: dict
                  show_if: [["type", "=", "host_path"]]
                  attrs:
                    - variable: acl_enable
                      label: Enable ACL
                      description: Enable ACL for the storage.
                      schema:
                        type: boolean
                        default: false
                    - variable: acl
                      label: ACL Configuration
                      schema:
                        type: dict
                        show_if: [["acl_enable", "=", true]]
                        attrs: []
                        $ref:
                          - "normalize/acl"
                    - variable: path
                      label: Host Path
                      description: The host path to use for storage.
                      schema:
                        type: hostpath
                        show_if: [["acl_enable", "=", false]]
                        required: true

  - variable: resources
    label: ""
    group: Resources Configuration
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPUs
                description: CPUs limit for TrueNAS Config Backup.
                schema:
                  type: int
                  default: 1
                  required: true
              - variable: memory
                label: Memory (in MB)
                description: Memory limit for TrueNAS Config Backup.
                schema:
                  type: int
                  default: 512
                  required: true
