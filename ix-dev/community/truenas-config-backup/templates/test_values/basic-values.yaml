resources:
  limits:
    cpus: 1.0
    memory: 512

backup_config:
  truenas_url: "https://127.0.0.1"
  api_key: "test-api-key"
  verify_ssl: false
  cron_schedule: "0 3 * * 0"
  retention_count: 8
  include_secret_seed: true

network:
  web_port:
    bind_mode: published
    port_number: 30330

ix_volumes:
  backups: /opt/tests/mnt/truenas-config-backup/backups
  config: /opt/tests/mnt/truenas-config-backup/config

storage:
  backups:
    type: ix_volume
    ix_volume_config:
      dataset_name: backups
      create_host_path: true
  config:
    type: ix_volume
    ix_volume_config:
      dataset_name: config
      create_host_path: true
