services:
  truenas-config-backup:
    cap_drop:
    - ALL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    environment:
      BACKUP_DIR: /backups
      CONFIG_DIR: /config
      CRON_SCHEDULE: 30 4 * * *
      DASHBOARD_PASSWORD: test-dashboard-password
      INCLUDE_POOL_KEYS: 'false'
      INCLUDE_ROOT_AUTHORIZED_KEYS: 'false'
      INCLUDE_SECRET_SEED: 'true'
      NOTIFY_ON_SUCCESS: 'true'
      NOTIFY_WEBHOOK_URL: https://discord.com/api/webhooks/test/test
      NVIDIA_VISIBLE_DEVICES: void
      RETENTION_COUNT: '5'
      TRUENAS_API_KEY: test-api-key
      TRUENAS_URL: https://192.168.1.50
      TRUENAS_VERIFY_SSL: 'false'
      TZ: Etc/UTC
      UMASK: '002'
      UMASK_SET: '002'
      WEB_PORT: '30461'
    group_add:
    - 568
    healthcheck:
      interval: 30s
      retries: 5
      start_interval: 2s
      start_period: 15s
      test:
      - CMD-SHELL
      - '/bin/bash -c ''{ printf "GET /healthz HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection:
        close\r\n\r\n" >&0; grep "HTTP" | grep -q "200"; } 0<>/dev/tcp/127.0.0.1/30461'''
      timeout: 5s
    image: ghcr.io/campasachamp/truenas-config-backup:0.12.0
    platform: linux/amd64
    ports:
    - mode: ingress
      protocol: tcp
      published: 30461
      target: 30461
    privileged: false
    restart: unless-stopped
    security_opt:
    - no-new-privileges=true
    stdin_open: false
    tty: false
    user: 568:568
    volumes:
    - bind:
        create_host_path: false
        propagation: rprivate
      read_only: false
      source: /opt/tests/mnt/truenas-config-backup/backups
      target: /backups
      type: bind
    - bind:
        create_host_path: false
        propagation: rprivate
      read_only: false
      source: /opt/tests/mnt/truenas-config-backup/config
      target: /config
      type: bind
volumes: {}
x-action-required: false
x-notes: '# <app_name>


  ## Security


  **Read the following security precautions to ensure that you wish to continue using
  this application.**


  ---


  ### Container: [truenas-config-backup]


  #### Running user/group(s)


  - User: 568

  - Group: 568

  - Supplementary Groups: apps


  ---


  ## Bug Reports and Feature Requests


  If you find a bug in this app or have an idea for a new feature, please file an
  issue at

  https://github.com/truenas/apps

  '
x-portals:
- host: 0.0.0.0
  name: Web UI
  path: /
  port: 30461
  scheme: http
