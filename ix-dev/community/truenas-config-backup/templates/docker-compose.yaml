{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.app_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": 568, "gid": 568, "mode": "check"} %}

{% do c1.healthcheck.set_test("curl", {"port": values.network.web_port.port_number, "path": "/healthz"}) %}

{% do c1.environment.add_env("TRUENAS_URL", values.backup_config.truenas_url) %}
{% do c1.environment.add_env("TRUENAS_API_KEY", values.backup_config.api_key) %}
{% do c1.environment.add_env("TRUENAS_VERIFY_SSL", values.backup_config.verify_ssl) %}
{% do c1.environment.add_env("CRON_SCHEDULE", values.backup_config.cron_schedule) %}
{% do c1.environment.add_env("RETENTION_COUNT", values.backup_config.retention_count) %}
{% do c1.environment.add_env("INCLUDE_SECRET_SEED", values.backup_config.include_secret_seed) %}
{% do c1.environment.add_env("BACKUP_DIR", values.consts.backups_dir_path) %}
{% do c1.environment.add_env("CONFIG_DIR", values.consts.config_dir_path) %}
{% do c1.environment.add_env("WEB_PORT", values.network.web_port.port_number) %}

{% do c1.add_port(values.network.web_port) %}

{% do c1.add_storage(values.consts.backups_dir_path, values.storage.backups) %}
{% do perm_container.add_or_skip_action("backups", values.storage.backups, perms_config) %}

{% do c1.add_storage(values.consts.config_dir_path, values.storage.config) %}
{% do perm_container.add_or_skip_action("config", values.storage.config, perms_config) %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
