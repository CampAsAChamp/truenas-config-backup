# Manual re-publish only. Automated releases build and push from release.yml because
# tag pushes created by GITHUB_TOKEN do not trigger other workflows.
name: Publish image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver tag to build and publish (e.g. 0.1.1)
        required: true
        type: string
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest --cov=app --cov-report=term-missing

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.version) || github.ref }}

      - name: Verify catalog versions match git tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          version_file=$(tr -d '[:space:]' < VERSION)
          app_version=$(grep '^app_version:' ix-dev/community/truenas-config-backup/app.yaml | awk '{print $2}')
          image_tag=$(grep 'tag:' ix-dev/community/truenas-config-backup/ix_values.yaml | head -1 | awk '{print $2}')
          if [ "$version_file" != "$TAG" ]; then
            echo "VERSION ($version_file) does not match tag ($TAG)"
            exit 1
          fi
          if [ "$app_version" != "$TAG" ]; then
            echo "app.yaml app_version ($app_version) does not match tag ($TAG)"
            exit 1
          fi
          if [ "$image_tag" != "$TAG" ]; then
            echo "ix_values.yaml image tag ($image_tag) does not match tag ($TAG)"
            exit 1
          fi
          echo "Catalog versions match tag $TAG"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/campasachamp/truenas-config-backup:${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
            ghcr.io/campasachamp/truenas-config-backup:latest
