# Manual re-publish via workflow_dispatch or tag push. Automated releases call this
# workflow from release.yml because tag pushes created by GITHUB_TOKEN do not trigger
# other workflows on GitHub.
name: Publish Docker image

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to checkout
        required: true
        type: string
      tag:
        description: Semver tag for catalog checks and image tag
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Semver tag to build and publish (e.g. 0.1.1)
        required: true
        type: string
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish Docker image
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || format('refs/tags/{0}', inputs.version) || github.ref }}

      - name: Verify catalog versions match tag
        run: |
          set -euo pipefail
          version_file=$(tr -d '[:space:]' < VERSION)
          app_version=$(grep '^app_version:' ix-dev/community/truenas-config-backup/app.yaml | awk '{print $2}')
          image_tag=$(grep 'tag:' ix-dev/community/truenas-config-backup/ix_values.yaml | head -1 | awk '{print $2}')
          if [ "$version_file" != "$TAG" ]; then
            echo "VERSION ($version_file) does not match tag ($TAG)"
            exit 1
          fi
          if [ "$app_version" != "$TAG" ]; then
            echo "app.yaml app_version ($app_version) does not match tag ($TAG)"
            exit 1
          fi
          if [ "$image_tag" != "$TAG" ]; then
            echo "ix_values.yaml image tag ($image_tag) does not match tag ($TAG)"
            exit 1
          fi
          echo "Catalog versions match tag $TAG"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/campasachamp/truenas-config-backup:${{ env.TAG }}
            ghcr.io/campasachamp/truenas-config-backup:latest
