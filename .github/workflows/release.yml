name: Release

on:
  push:
    branches:
      - main
    # UI-only pushes run Dashboard screenshot first; release follows via workflow_run.
    paths-ignore:
      - "app/src/templates/**"
      - "app/src/static/**"
      - "app/src/VERSION"
      - "scripts/seed-local-data.py"
      - ".readme-screenshot.yml"
  workflow_run:
    workflows:
      - Dashboard screenshot
    types:
      - completed
    branches:
      - main

concurrency:
  group: main-line
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  test:
    if: >-
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/test.yml
    with:
      ref: main

  release:
    name: Release new version
    needs: test
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Sync to latest main
        run: git pull --ff-only origin main

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - run: npm ci

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    uses: ./.github/workflows/publish-image.yml
    with:
      ref: refs/tags/${{ needs.release.outputs.new_release_version }}
      tag: ${{ needs.release.outputs.new_release_version }}
    permissions:
      contents: read
      packages: write
