{% from "_icons.html" import icon %}
<section class="display-settings panel">
  <div class="display-settings__header">
    <h2>{{ icon("clock", 22) }} Display Settings</h2>
    <button type="button" class="button button--ghost display-reset" id="display-reset">
      {{ icon("rotate-ccw", 16) }} Reset To Defaults
    </button>
  </div>
  <form id="display-settings-form" onsubmit="return false;">
    <label>
      <span class="display-field-label">{{ icon("calendar", 18) }} Date Format</span>
      <select id="display-date-format">
        <option value="dd/mm/yy">dd/mm/yy</option>
        <option value="dd/mm/yyyy">dd/mm/yyyy</option>
        <option value="mm/dd/yy">mm/dd/yy</option>
        <option value="mm/dd/yyyy">mm/dd/yyyy</option>
        <option value="iso">ISO 8601</option>
      </select>
    </label>
    <label class="clock-format" id="display-clock-format-row">
      <span class="display-field-label">{{ icon("clock", 18) }} Clock</span>
      <select id="display-clock-format">
        <option value="24h">24-hour</option>
        <option value="12h">12-hour</option>
      </select>
    </label>
    <label>
      <span class="display-field-label">{{ icon("globe", 18) }} Timezone</span>
      <select id="display-timezone-mode">
        <option value="local">Local</option>
        <option value="utc">UTC</option>
        <option value="manual">Manual</option>
      </select>
    </label>
    <p class="local-timezone-hint" id="display-local-timezone" hidden></p>
    <label class="manual-timezone">
      <span class="display-field-label">{{ icon("map-pin", 18) }} Region</span>
      <select id="display-timezone">
        <option value="">Select region…</option>
      </select>
    </label>
    <div class="display-preview">
      <span class="display-preview-label display-field-label">{{ icon("eye", 18) }} Preview</span>
      <output id="display-preview" for="display-settings-form" aria-live="polite"></output>
    </div>
  </form>
</section>
