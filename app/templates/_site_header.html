<header class="site-header">
  <img class="logo" src="{{ static_url('logo.svg') }}" alt="" width="48" height="48">
  <div>
    <h1>TrueNAS Config Backup</h1>
    <span class="version">v{{ version }}</span>
  </div>
  {% if back_href %}
  <div class="site-header__actions">
    <a class="button button--ghost" href="{{ back_href }}">Back to dashboard</a>
    <form class="logout-form" method="post" action="/logout">
      <button type="submit" class="button button--ghost">Log out</button>
    </form>
  </div>
  {% else %}
  <form class="logout-form" method="post" action="/logout">
    <button type="submit" class="button button--ghost">Log out</button>
  </form>
  {% endif %}
</header>
